name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Test deterministic core
        run: npm test

      - name: Lint website
        run: npm run lint:web

      - name: Build website
        run: npm run build:web

      - name: Build desktop source
        run: npm run build:desktop
